[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "davinci-resolve-ai-bridge-mcp"
version = "1.8.1"
description = "A local MCP bridge that lets AI coding assistants view and edit the project open in DaVinci Resolve"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["mcp>=1.12,<2"]

[tool.setuptools]
packages = ["bridge"]